# config/models.yaml

# Esta es la biblioteca de "Cerebros" disponibles para todos los agentes.

default_model: "gemma-ollama-local"

models:
  - id: "deepseek-api-oficial" # Identificador único y técnico de la configuración
    alias: "deepseek"           # Comando corto para la CLI (/model deepseek)
    nombre_display: "DeepSeek (API)" # Nombre "bonito" que se muestra en la UI
    provider: "deepseek"        # Clase interna que se usará
    config:
      modelo_provider: "deepseek-chat" # Nombre EXACTO que espera la API de DeepSeek

  - id: "gemma-ollama-local"
    alias: "gema"
    nombre_display: "Gemma (Ollama)"
    provider: "ollama"
    config:
      modelo_provider: "gemma3:4b" # Usar el tag del modelo instalado por el usuario
      base_url: "http://localhost:11434"

      
  