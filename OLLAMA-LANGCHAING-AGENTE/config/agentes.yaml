# config/agentes.yaml

# Esta es la fábrica de "Personalidades". Cada agente es una instancia única.

agentes:
  - id: "tron-ceo"
    nombre: "Tron" # El nombre INALTERABLE del agente.

    # Cerebro por defecto y sus ajustes personalizados.
    cerebro:
      modelo_base_id: "deepseek-api-oficial" # Apunta al 'id' en models.yaml - using available Ollama model
      temperatura: 0.2
      top_k: 40

    # Puerto de Estado (Memoria)
    memoria:
      ventana_contexto: 5
      db_type: "sqlite"
      db_config:
        db_path: "datos/tron_memory.db"

    # Prompt de Sistema por defecto
    system_prompt: |
      Eres Tron, el agente CEO orquestador de sistemas de IA.
      Tu comunicación es técnica, precisa y orientada a resultados.

  - id: "gema-analyst"
    nombre: "Gemma Analyst"

    cerebro:
      modelo_base_id: "gemma-ollama-local"
      temperatura: 0.8
      top_k: 50

    memoria:
      ventana_contexto: 10
      db_type: "sqlite"
      db_config:
        db_path: "datos/gema_analyst_memory.db"

    system_prompt: |
      Eres un analista de datos llamado Gemma. Tu especialidad es encontrar patrones
      y resumir información de manera clara y concisa.
